<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>JIRAMA Relevés PRO</title>
    <meta name="description" content="Application professionnelle de relevés de consommation JIRAMA pour techniciens de maintenance.">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563eb">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3105/3105807.png">
    
    <!-- Correction 404 CSS -->
    <link rel="stylesheet" href="./index.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Babel Standalone : Indispensable pour exécuter du .tsx sur GitHub Pages sans compilation préalable -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow-x: hidden;
            background-color: #f8fafc;
        }
        .night-mode { background-color: #000000 !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@19.0.0/",
        "react": "https://esm.sh/react@19.0.0",
        "react-dom/": "https://esm.sh/react-dom@19.0.0/",
        "framer-motion": "https://esm.sh/framer-motion@11.11.17",
        "lucide-react": "https://esm.sh/lucide-react@0.460.0",
        "jspdf": "https://esm.sh/jspdf@2.5.2"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    
    <!-- Utilisation de Babel pour charger le point d'entrée TSX -->
    <script type="text/babel" data-type="module" data-presets="typescript,react" src="./index.tsx"></script>
    
    <script>
      // Service Worker (Optionnel pour le debug, indispensable pour PWA)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then(reg => console.log('SW Ready'))
            .catch(err => console.log('SW Error', err));
        });
      }
    </script>
</body>
</html>
